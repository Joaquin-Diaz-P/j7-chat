appId: cl.j7.chat
productName: J7 Chat
directories:
  output: release
files:
  - out/**/*
  - assets/iconTemplate*.png
  - THIRD_PARTY_NOTICES.md
  - package.json
  # J7 uses the Claude Code the person already has installed, so the SDK's bundled binary (~300 MB) stays out.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
afterSign: scripts/signing/after-sign.cjs
asar: true
electronLanguages:
  - es
  - es_419
  - en
extraResources:
  - from: build/j7-helper
    to: j7-helper
mac:
  identity: null
  icon: assets/icon.icns
  target:
    - target: dmg
      arch: arm64
  extendInfo:
    LSUIElement: false
    NSScreenCaptureUsageDescription: J7 Chat captura la zona elegida de la pantalla para adjuntarla a tu pregunta.
    NSMicrophoneUsageDescription: J7 Chat mide el volumen de tu voz mientras dictas con Hex para animar la onda. No graba ni guarda audio; Hex transcribe.
dmg:
  sign: false
  format: ULFO
